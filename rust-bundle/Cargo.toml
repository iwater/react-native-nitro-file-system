[package]
name = "rn-file-system"
version = "0.1.0"
edition = "2021"
description = "Node.js compatible file system module for React Native implemented in Rust"
authors = ["iwater <iwater@gmail.com>"]
license = "ISC"

[lib]
name = "rn_file_system"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "0.2"
log = "0.4"
thiserror = "1.0"
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"
walkdir = "2.4"
filetime = "0.2"
chrono = "0.4"
base64 = "0.21"
once_cell = "1.21.3"
rand = "0.9.2"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
crossbeam-channel = "0.5"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
